<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Move Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="cmh-popup">
    <header class="cmh-header">
      <div>
        <div class="cmh-eyebrow">LOCAL CHESS ENGINE</div>
        <h1>Chess Move Helper</h1>
      </div>
      <div class="cmh-dot" id="cmh-dot"></div>
    </header>

    <section class="cmh-status-card">
      <div class="cmh-status-label">STATUS</div>
      <div class="cmh-status" id="cmh-status">Connecting...</div>
      <div class="cmh-detail" id="cmh-detail">Open a Chess.com board to begin.</div>
    </section>

    <button class="cmh-scan" id="cmh-scan">Analyze Position</button>

    <section class="cmh-options">
      <div class="cmh-option">
        <div>
          <div class="cmh-option-title">Alternative arrows</div>
          <div class="cmh-option-subtitle">Show good, okay, and bad candidates</div>
        </div>
        <button class="cmh-toggle cmh-on" id="cmh-alternatives" aria-pressed="true">
          <span></span>
        </button>
      </div>

      <div class="cmh-option">
        <div>
          <div class="cmh-option-title">Opening book</div>
          <div class="cmh-option-subtitle" id="cmh-book-status">Loading built-in books...</div>
        </div>
        <button class="cmh-toggle cmh-on" id="cmh-book-enabled" aria-pressed="true">
          <span></span>
        </button>
      </div>

      <div class="cmh-book-mode">
        <label class="cmh-book-mode-label" for="cmh-book-mode">Book selection</label>
        <select id="cmh-book-mode"></select>
      </div>

      <div class="cmh-book-row">
        <label class="cmh-book-button" for="cmh-book-file">Load .bin book</label>
        <input id="cmh-book-file" type="file" accept=".bin,application/octet-stream">
        <button class="cmh-book-clear" id="cmh-book-clear">Clear</button>
      </div>
    </section>

    <section class="cmh-legend">
      <div class="cmh-section-title">MOVE TYPES</div>
      <div class="cmh-legend-grid">
        <div><span class="cmh-swatch cmh-best"></span>Best</div>
        <div><span class="cmh-swatch cmh-good"></span>Good</div>
        <div><span class="cmh-swatch cmh-ok"></span>Okay</div>
        <div><span class="cmh-swatch cmh-bad"></span>Bad</div>
      </div>
    </section>

    <footer class="cmh-footer">Randomized Polyglot books • Local engine fallback</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
