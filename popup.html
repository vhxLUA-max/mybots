<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Move Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="cmh-popup">
    <header class="cmh-header">
      <div>
        <div class="cmh-eyebrow">LOCAL ENGINE</div>
        <h1>Chess Move Helper</h1>
      </div>
      <div class="cmh-dot" id="cmh-dot"></div>
    </header>

    <section class="cmh-status-card">
      <div class="cmh-status-label">STATUS</div>
      <div class="cmh-status" id="cmh-status">Connecting...</div>
      <div class="cmh-detail" id="cmh-detail">Open a Chess.com board to begin.</div>
    </section>

    <button class="cmh-scan" id="cmh-scan">Analyze Position</button>

    <section class="cmh-options">
      <div class="cmh-option">
        <div>
          <div class="cmh-option-title">Alternative arrows</div>
          <div class="cmh-option-subtitle">Show good, okay, and bad candidates</div>
        </div>
        <button class="cmh-toggle cmh-on" id="cmh-alternatives" aria-pressed="true">
          <span></span>
        </button>
      </div>

      <div class="cmh-option">
        <div>
          <div class="cmh-option-title">Hide arrows</div>
          <div class="cmh-option-subtitle">Keep the engine running in the background</div>
        </div>
        <button class="cmh-toggle" id="cmh-hidden" aria-pressed="false">
          <span></span>
        </button>
      </div>
    </section>

    <section class="cmh-legend">
      <div class="cmh-section-title">MOVE TYPES</div>
      <div class="cmh-legend-grid">
        <div><span class="cmh-swatch cmh-best"></span>Best</div>
        <div><span class="cmh-swatch cmh-good"></span>Good</div>
        <div><span class="cmh-swatch cmh-ok"></span>Okay</div>
        <div><span class="cmh-swatch cmh-bad"></span>Bad</div>
      </div>
    </section>

    <footer class="cmh-footer">Built-in local engine • No Stockfish required</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
